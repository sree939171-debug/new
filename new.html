<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart WhatsApp Restaurant Management</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f4; margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        h1 { text-align: center; color: #d35400; text-transform: uppercase; font-size: 22px; }
       
        .user-info { background: #fff3e0; padding: 15px; border-radius: 10px; border: 1px solid #ffb74d; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }

        .section-title { background: #d35400; color: white; padding: 10px; border-radius: 5px; margin-top: 20px; font-weight: bold; clear: both; }
       
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .item-details { flex-grow: 1; }
        .item-name { font-weight: 500; font-size: 16px; display: block; }
        .price { color: #27ae60; font-weight: bold; }

        .order-btn { 
            background-color: #25D366; 
            color: white; 
            border: none; 
            padding: 8px 15px; 
            font-weight: bold; 
            border-radius: 5px; 
            cursor: pointer; 
            text-decoration: none;
            font-size: 14px;
        }
        .order-btn:hover { background-color: #128C7E; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍽️ zyana restaurant menu</h1>

    <div class="user-info">
        <label>Your Name:</label>
        <input type="text" id="custName" placeholder="Enter Your Name">
        <label>Table Number:</label>
        <select id="tableNo">
            <option value="1">Table 1</option>
            <option value="2">Table 2</option>
            <option value="3">Table 3</option>
            <option value="4">Table 4</option>
        </select>
    </div>

    <div class="section-title">☕ Tiffin (Breakfast)</div>
    <div id="tiffin-list"></div>

    <div class="section-title">🍛 Main Course (Biryani & Meals)</div>
    <div id="main-course-list"></div>

    <div class="section-title">🥤 Cool Drinks & Desserts</div>
    <div id="drinks-list"></div>
</div>

<script>
    const menuData = {
        tiffin: [
            ["Idli (2)", "₹40"], ["Masala Dosa", "₹60"], ["Vada (2)", "₹50"],
            ["Ghee podi idly", "₹50"], ["Upma", "₹60"], ["Puri(3)", "₹60"],
            ["Mysore Bajji (3)", "₹40"], ["Ragi Dosa", "₹55"], ["Plain Dosa", "₹50"]
        ],
        mainCourse: [
            ["Chicken Biryani", "₹250"], ["Mutton Biryani", "₹350"], ["Veg Biryani", "₹180"],
            ["Thali", "₹120"], ["paneer butter masala", "₹150"], ["Naan/roti", "₹30"],
            ["Veg Fried Rice", "₹60"], ["Curd Rice", "₹40"], ["Butter Chicken", "₹200"],
            ["Chicken Curry", "₹150"], ["Mutton Curry", "₹300"]
        ],
        drinks: [
            ["Soft Drinks", "₹40"], ["Almond Milk", "₹50"], ["Gulab Jamun (2)", "₹60"],
            ["Cold Coffee", "₹70"], ["Fresh Lime Soda", "₹40"], ["Fruit Juices", "₹50"],
            ["Milk Shakes", "₹100"], ["Filter Coffee", "₹50"], ["Ginger Tea", "₹20"],
            ["Mineral Water(1 Liter)", "₹20"], ["Ice Cream", "₹35"]
        ]
    };

    function renderMenu(items, containerId) {
        const container = document.getElementById(containerId);
        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'menu-item';
            div.innerHTML = `
                <div class="item-details">
                    <span class="item-name">${item[0]}</span>
                    <span class="price">${item[1]}</span>
                </div>
                <button class="order-btn" onclick="sendWhatsApp('${item[0]}', '${item[1]}')">Order</button>
            `;
            container.appendChild(div);
        });
    }

    renderMenu(menuData.tiffin, 'tiffin-list');
    renderMenu(menuData.mainCourse, 'main-course-list');
    renderMenu(menuData.drinks, 'drinks-list');

    function sendWhatsApp(itemName, price) {
        const myNumber = "916302031996";
        const name = document.getElementById('custName').value;
        const table = document.getElementById('tableNo').value;

        if (name.trim() === "") {
            alert("Please enter your name first!");
            return;
        }

        const text = `*New Order Received!*%0A--------------------------%0A*Name:* ${name}%0A*Table:* Table ${table}%0A*Item:* ${itemName}%0A*Price:* ${price}%0A--------------------------`;
        const waUrl = `https://wa.me/${myNumber}?text=${text}`;
        window.open(waUrl, '_blank').focus();
    }
</script>

</body>
</html>
